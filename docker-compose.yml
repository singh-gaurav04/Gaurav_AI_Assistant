services:
  api:
    build: .
    env_file: .env
    environment:
      # Always use the compose Postgres service (ignore localhost/remote URLs in .env).
      DATABASE_URL: postgresql+asyncpg://portfolio:portfolio@db:5432/portfolio
      DATABASE_SSL: disable
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
